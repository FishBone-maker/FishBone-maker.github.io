# The Site Configuration

# Import the theme
theme: jekyll-theme-chirpy

# 改成中文界面
lang: zh-CN

# Change to your timezone › https://zones.arilyn.cc
timezone: Asia/Shanghai

# jekyll-seo-tag settings › https://github.com/jekyll/jekyll-seo-tag/blob/master/docs/usage.md
# ↓ --------------------------

title: FishBone-maker 的技术站 # 网站标题

tagline: 嵌入式/电子信息项目展示博客 # 副标题

description: >-
  个人技术项目展示网站，分享嵌入式、单片机、算法相关项目与开发笔记。

# 网站地址，必须填对
url: "https://FishBone-maker.github.io"

github:
  username: FishBone-maker # 你的GitHub用户名

twitter:
  username: # 没有就留空

social:
  name: 你的名字 # 替换成你自己的姓名
  email: 你的邮箱 # 替换成你的邮箱
  fediverse_handle:
  links:
    # 第一个链接会显示在页脚版权处
    - https://github.com/FishBone-maker # 你的GitHub主页
    # 可按需添加知乎、CSDN等链接
    # - https://blog.csdn.net/xxx

# Site Verification Settings
webmaster_verifications:
  google:
  bing:
  alexa:
  yandex:
  baidu:
  facebook:

# ↑ --------------------------
# The end of `jekyll-seo-tag` settings

# Web Analytics Settings
analytics:
  google:
    id:
  goatcounter:
    id:
  umami:
    id:
    domain:
  matomo:
    id:
    domain:
  cloudflare:
    id:
  fathom:
    id:

# Page views settings
pageviews:
  provider:

# 主题默认跟随系统明暗，不用改
theme_mode:

# CDN资源，保留默认
cdn: "https://chirpy-img.netlify.app"

# 头像路径，后续你上传头像到 assets/img/avatar.jpg 再改这里
avatar: "/assets/img/avatar.jpg"

social_preview_image:
toc: true

actions:
  edit_post:
    enabled: false
    url: ""
    static_url: false

comments:
  provider:

# PWA功能开启
pwa:
  enabled: true
  cache:
    enabled: true
    deny_paths:

paginate: 10

baseurl: ""

# 下方代码无需改动
kramdown:
  footnote_backlink: "&#8617;&#xfe0e;"
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    css_class: highlight
    span:
      line_numbers: false
    block:
      line_numbers: true
      start_line: 1

collections:
  tabs:
    output: true
    sort_by: order

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      comments: true
      toc: true
      permalink: /posts/:title/
  - scope:
      path: _drafts
    values:
      comments: false
  - scope:
      path: ""
      type: tabs
    values:
      layout: page
      permalink: /:title/

sass:
  style: compressed

compress_html:
  clippings: all
  comments: all
  endings: all
  profile: false
  blanklines: false
  ignore:
    envs: [development]

exclude:
  - "*.gem"
  - "*.gemspec"
  - docs
  - tools
  - README.md
  - LICENSE
  - purgecss.js
  - "*.config.js"
  - "package*.json"

jekyll-archives:
  enabled: [categories, tags]
  layouts:
    category: category
    tag: tag
  permalinks:
    tag: /tags/:name/
    category: /categories/:name/
